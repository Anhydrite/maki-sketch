min_maki_version = "0.7.0"

# A managed package requests exactly what its manifest lists. Keep this list
# minimal: the canvas reads its own files, saves `.sketch/`, reads the session
# and writes `#N` into the chat input. `env` is only for the headless
# self-test in development.
[permissions]
fs_read = true
fs_write = true
env = true
agent = true
session_read = true
session_write = true
input = true
